<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de Criativos · Utilizaí</title>
<meta name="theme-color" content="#2140ba">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #2140ba; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .aviso { position: fixed; right: 12px; bottom: 12px; z-index: 2; font: 600 12px/1.2 Arial, sans-serif; }
  .aviso a { color: #fff; background: rgba(33,64,186,.85); padding: 8px 12px; border-radius: 8px; text-decoration: none; display: none; }
</style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbzk_ZZGCnMDBOOh2_3h75LbuJTyL6E4aTUQrY8ipg1HzGTsRAqwScCQKAd8sbLT1K201A/exec"
    title="Gestão de Criativos · Utilizaí"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div class="aviso"><a id="abrir" href="https://script.google.com/macros/s/AKfycbzk_ZZGCnMDBOOh2_3h75LbuJTyL6E4aTUQrY8ipg1HzGTsRAqwScCQKAd8sbLT1K201A/exec" target="_blank" rel="noopener">Não carregou? Abrir em nova aba</a></div>
  <script>
    // Mostra o link alternativo só se o app demorar demais pra carregar
    var carregou = false;
    document.querySelector('iframe').addEventListener('load', function () { carregou = true; });
    setTimeout(function () { if (!carregou) document.getElementById('abrir').style.display = 'inline-block'; }, 12000);
  </script>
</body>
</html>
